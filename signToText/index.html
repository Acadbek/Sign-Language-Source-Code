<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Recognition</title>
<!--    <script src="https://appssdk.zoom.us/sdk.min.js"></script>-->
<!--    <script src="https://appssdk.zoom.us/sdk.js"></script>-->
    <script src="https://appssdk.zoom.us/sdk.js" crossorigin="anonymous"></script>
    <script>

    // Detect if SDK loaded
    window.addEventListener('DOMContentLoaded', () => {
        const debugDiv = document.getElementById('debugLog');
        if (debugDiv) {
            if (typeof ZoomSdk !== 'undefined') {
                debugDiv.innerHTML += '[SDK CHECK] ✅ ZoomSdk is available!<br>';
            } else {
                debugDiv.innerHTML += '[SDK CHECK] ❌ ZoomSdk is NOT available!<br>';
                debugDiv.innerHTML += '[SDK CHECK] Checking window object...<br>';
                debugDiv.innerHTML += '[SDK CHECK] Available: ' + Object.keys(window).filter(k => k.toLowerCase().includes('zoom')).join(', ') + '<br>';
            }
        }
    });
</script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }
        h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 2em; }
        .video-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        #processedVideo { width: 100%; height: auto; display: block; }
        #localVideo { display: none; }
        .sentence-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            text-align: center;
            word-wrap: break-word;
        }
        .sentence-display.empty { font-style: italic; opacity: 0.7; }
        .controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        #startBtn { background: #4CAF50; color: white; }
        #startBtn:hover { background: #45a049; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3); }
        #stopBtn { background: #f44336; color: white; }
        #stopBtn:hover { background: #da190b; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3); }
        #stopBtn:disabled, #startBtn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
        #clearBtn { background: #ff9800; color: white; }
        #clearBtn:hover { background: #e68900; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 152, 0, 0.3); }
        .status {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-weight: 500;
        }
        .status.connected { background: #d4edda; color: #155724; }
        .status.disconnected { background: #f8d7da; color: #721c24; }
        .status.processing { background: #fff3cd; color: #856404; }
        .status.zoom-ready { background: #cfe2ff; color: #084298; }
        #debugLog {
            background: #000;
            color: #0f0;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 150px;
            overflow-y: auto;
            margin: 10px 0;
            border-radius: 5px;
            border: 2px solid #0f0;
        }
        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #2196F3;
        }
        .info h3 { margin-bottom: 10px; color: #1976D2; }
        .info ul { list-style-position: inside; color: #555; }
        .info li { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤟 Sign Language Recognition</h1>
        <div class="video-container">
            <img id="processedVideo" src="" alt="Processed video feed">
            <video id="localVideo" autoplay playsinline></video>
        </div>
        <div class="sentence-display" id="sentenceDisplay">
            <span class="empty">Initializing Zoom App...</span>
        </div>
        <div class="controls">
            <button id="startBtn" disabled>Start Camera</button>
            <button id="stopBtn" disabled>Stop Camera</button>
            <button id="clearBtn">Clear Sentence</button>
        </div>
        <div id="status" class="status disconnected">Initializing Zoom SDK...</div>
        <div id="debugLog"></div>
        <div class="info">
            <h3>Instructions:</h3>
            <ul>
                <li>Click "Start Camera" to begin recognition</li>
                <li>Show hand signs to the camera</li>
                <li>Recognized words appear in the purple box above</li>
                <li>Click "Clear Sentence" to reset</li>
            </ul>
        </div>
    </div>

    <script>
        function debugLog(msg) {
            console.log(msg);
            const d = document.getElementById('debugLog');
            if(d) {
                const time = new Date().toLocaleTimeString();
                d.innerHTML += `[${time}] ${msg}<br>`;
                d.scrollTop = d.scrollHeight;
            }
        }

        let zoomAppContext = null;
        let socket = null;
        let myZoomSdk = null;
        const localVideo = document.getElementById('localVideo');
        const processedVideo = document.getElementById('processedVideo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const sentenceDisplay = document.getElementById('sentenceDisplay');
        const statusDiv = document.getElementById('status');
        let localStream = null;
        let isStreaming = false;
        let canvas = document.createElement('canvas');
        let ctx = canvas.getContext('2d');
        let frameInterval = null;

        debugLog('🚀 Script starting...');
        debugLog('Checking for ZoomSdk...');

        if (typeof ZoomSdk !== 'undefined') {
            debugLog('✅ ZoomSdk found! Initializing...');
            myZoomSdk = new ZoomSdk();

            myZoomSdk.config({
                version: '0.16',
                popoutSize: { width: 480, height: 360 },
                capabilities: ['shareApp', 'openUrl', 'connect', 'onConnect', 'getMeetingContext', 'getUserContext']
            }).then(async (configResponse) => {
                debugLog('✅ Zoom SDK configured successfully');

                try {
                    const meetingContext = await myZoomSdk.getMeetingContext();
                    const userContext = await myZoomSdk.getUserContext();
                    debugLog('✅ Got Zoom context');
                    zoomAppContext = { meetingContext, userContext };
                } catch (error) {
                    debugLog('⚠️ Could not get Zoom context: ' + error.message);
                }

                statusDiv.textContent = '✅ Zoom App Ready - Connecting to server...';
                statusDiv.className = 'status zoom-ready';
                initializeSocketIO();

            }).catch((error) => {
                debugLog('❌ Zoom SDK config failed: ' + error.message);
                statusDiv.textContent = '❌ Zoom SDK Error: ' + error.message;
                statusDiv.className = 'status disconnected';
                debugLog('🔄 Attempting Socket.IO fallback...');
                initializeSocketIO();
            });
        } else {
            debugLog('⚠️ ZoomSdk NOT available - browser mode');
            statusDiv.textContent = '⚠️ Browser mode - Zoom SDK not available';
            statusDiv.className = 'status disconnected';
            initializeSocketIO();
        }

        function initializeSocketIO() {
            debugLog('📡 Connecting to Socket.IO at: ' + window.location.origin);

            socket = io(window.location.origin, {
                transports: ['polling', 'websocket'],
                reconnection: true,
                reconnectionDelay: 1000,
                reconnectionAttempts: 5,
                timeout: 10000
            });

            socket.on('connect', () => {
                debugLog('✅ Socket.IO connected! ID: ' + socket.id);
                statusDiv.textContent = '✅ Connected to server';
                statusDiv.className = 'status connected';
                startBtn.disabled = false;
                sentenceDisplay.innerHTML = '<span class="empty">Make signs to start...</span>';
            });

            socket.on('disconnect', (reason) => {
                debugLog('❌ Socket.IO disconnected: ' + reason);
                statusDiv.textContent = '❌ Disconnected from server';
                statusDiv.className = 'status disconnected';
                stopCamera();
            });

            socket.on('connect_error', (error) => {
                debugLog('❌ Socket.IO error: ' + error.message);
                statusDiv.textContent = '❌ Connection error: ' + error.message;
                statusDiv.className = 'status disconnected';
            });

            socket.on('processed_frame', (data) => {
                processedVideo.src = data.image;
                if (data.sentence) {
                    sentenceDisplay.innerHTML = data.sentence;
                    debugLog("🤟 Recognized:" + data.sentence);
                    sentenceDisplay.classList.remove('empty');
                } else {
                    sentenceDisplay.innerHTML = '<span class="empty">Make signs to start...</span>';
                    sentenceDisplay.classList.add('empty');
                }
                if (data.recognized_word) {
                    debugLog('🤟 Recognized: ' + data.recognized_word);
                }
            });
        }

        async function startCamera() {
            try {
                debugLog('📷 Requesting camera access...');
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 15 } },
                    audio: false
                });
                debugLog('✅ Camera access granted');
                localVideo.srcObject = localStream;
                await new Promise((resolve) => { localVideo.onloadedmetadata = resolve; });
                await localVideo.play();
                canvas.width = localVideo.videoWidth;
                canvas.height = localVideo.videoHeight;
                debugLog('📐 Canvas: ' + canvas.width + 'x' + canvas.height);
                isStreaming = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                statusDiv.textContent = '🎥 Processing video...';
                statusDiv.className = 'status processing';
                debugLog('📡 Starting frame transmission...');
                sendFrames();
            } catch (err) {
                debugLog('❌ Camera error: ' + err.message);
                alert('Could not access camera: ' + err.message);
                statusDiv.textContent = '❌ Camera error';
                statusDiv.className = 'status disconnected';
            }
        }

        function sendFrames() {
            if (!isStreaming || !socket || !socket.connected) {
                debugLog('⏸️ Stopped streaming');
                return;
            }
            try {
                ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
                const imageData = canvas.toDataURL('image/jpeg', 0.75);
                socket.emit('video_frame', { image: imageData });
                frameInterval = setTimeout(sendFrames, 100);
            } catch (err) {
                debugLog('❌ Frame send error: ' + err.message);
                stopCamera();
            }
        }

        function stopCamera() {
            debugLog('🛑 Stopping camera');
            isStreaming = false;
            if (frameInterval) {
                clearTimeout(frameInterval);
                frameInterval = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            localVideo.srcObject = null;
            processedVideo.src = '';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            statusDiv.textContent = '⏹️ Camera stopped';
            statusDiv.className = 'status disconnected';
        }

        function clearSentence() {
            if (socket && socket.connected) {
                socket.emit('clear_sentence');
                sentenceDisplay.innerHTML = '<span class="empty">Make signs to start...</span>';
                sentenceDisplay.classList.add('empty');
                debugLog('🗑️ Sentence cleared');
            }
        }

        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);
        clearBtn.addEventListener('click', clearSentence);
        window.addEventListener('beforeunload', () => {
            stopCamera();
            if (socket) socket.disconnect();
        });
        window.addEventListener('error', (event) => {
            debugLog('💥 Global error: ' + event.error);
        });

        debugLog('✅ Script loaded successfully');
    </script>
</body>
</html>
